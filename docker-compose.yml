name: ap-eml
services:
  kafka:
    image: 'bitnami/kafka:3.8.0'
    container_name: ap-eml-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - '9094:9094'
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
  redis:
    image: 'redis:7.2-alpine'
    container_name: ap-eml-redis
    hostname: redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --requirepass supersecretpassword
  mysql:
    image: 'mysql:8.0.36-debian'
    container_name: ap-eml-mysql
    hostname: mysql
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=FA25SE225_Capstone
    volumes:
      - db_data:/var/lib/mysql

  minio:
    image: minio/minio:latest
    container_name: ap-eml-minio
    hostname: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  backend:
    build: .
    container_name: ap-eml-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
      - kafka
      - minio
    environment:
      # Database Config
      - url=jdbc:mysql://mysql:3306/FA25SE225_Capstone?useSSL=false&allowPublicKeyRetrieval=true
      - usr=root
      - pass=root
      # Redis Config
      - REDIS_URL=redis://:supersecretpassword@redis:6379
      # Kafka Config
      - KAFKA_SERVERS=kafka:9092
      # MinIO Config
      - url-minio=http://minio:9000
      - access-key=minioadmin
      - secret-key=minioadmin
      # External APIs (Bạn cần điền các key thực tế vào đây hoặc dùng file .env)

volumes:
  db_data:
  minio_data:
