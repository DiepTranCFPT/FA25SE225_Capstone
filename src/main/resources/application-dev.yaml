spring:
  datasource:
    url: ${url}
    username: ${usr}
    password: ${pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      url: ${REDIS_URL}
  cache:
    type: redis

  ai:
    openai:
      api-key: ${GEMINI_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta
      chat:
        options:
          model: gemini-2.0-flash
          temperature: 0.2
      embedding:
        options:
          model: text-embedding-004
    vectorstore:
      redis:
        index: faq_idx
        prefix: faq
        dimension: 768


  jpa:
    hibernate:
      ddl-auto: update

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS}
    properties:
      security:
        protocol: PLAINTEXT
      client:
        dns:
          lookup: use_all_dns_ips
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.fa25se225.capstone.dto.kafka"

brevo:
  api-key: ${BREVO_API_KEY}
  sender:
    name: "APCertificate"
    email: "diep.tranc@gmail.com"
  templates:
    VERIFY_EMAIL: 1
    TEMPORARY_PASSWORD: 7
    RESET_PASSWORD_OTP: 8
    ACCOUNT_LOCKED: 9

outbound:
  oauth2:
    client-id: ${OAUTH2_CLIENT_ID:aaaaaaaa}
    client-secret: ${OAUTH2_CLIENT_SECRET:aaaaaaaa}
    redirect-uri: "http://localhost:3000/authenticate"
    grant-type: "authorization_code"
jwt:
  signerKey: ${JWT_SIGNER_KEY}
  valid-duration-in-second: 3600
  refreshable-duration-in-second: 36000
  issuer: "Tri dep trai"

cloudinary:
  cloud-name: ${cloud}
  api-key: ${API_KEY}
  api-secret: ${secret}

server:
  port : 8080
  forward-headers-strategy : native
