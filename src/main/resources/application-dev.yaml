spring:
  datasource:
    url: ${url}
    username: ${usr}
    password: ${pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password: supersecretpassword
  cache:
    type: redis



  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true

  kafka:
    bootstrap-servers: kafka:9094

    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

brevo:
  api-key: ${BREVO_API_KEY}
  sender:
    name: "edcare"
    email: "dovantri1709@gmail.com"
  templates:
    VERIFY_EMAIL: 1
    TEMPORARY_PASSWORD: 2
    RESET_PASSWORD_OTP: 3
    ACCOUNT_LOCKED: 4

outbound:
  oauth2:
    client-id: ${OAUTH2_CLIENT_ID:aaaaaaaa}
    client-secret: ${OAUTH2_CLIENT_SECRET:aaaaaaaa}
    redirect-uri: "http://localhost:3000/authenticate"
    grant-type: "authorization_code"
jwt:
  signerKey: ${JWT_SIGNER_KEY}
  valid-duration-in-second: 3600
  refreshable-duration-in-second: 36000
  issuer: "Tri dep trai"

cloudinary:
  cloud-name: ${cloud}
  api-key: ${API_KEY}
  api-secret: ${secret}
